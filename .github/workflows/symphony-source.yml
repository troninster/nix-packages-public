name: Reconcile public component source and signed delivery

on:
  schedule:
    - cron: '27 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['pkgs/**', 'components/**']
  pull_request:
    paths:
      - 'components/**'
      - 'tools/component-*.py'
      - 'pkgs/*/update-source.py'
      - 'scripts/build-component'
      - 'tests/test_component*.py'
      - 'tools/symphony-source.py'
      - 'tools/symphony-reconcile.py'
      - 'tests/test_symphony_source.py'
      - 'tests/test_symphony_reconcile.py'
      - '.github/workflows/symphony-source.yml'
      - '.github/workflows/component-source-worker.yml'

permissions:
  contents: read

jobs:
  contracts:
    outputs:
      components: ${{ steps.registry.outputs.components }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: registry
        run: echo "components=$(python3 tools/component-contract.py list)" >> "$GITHUB_OUTPUT"
      - run: python3 -m unittest discover -s tests -p 'test_component_enrollment.py' -v
      - run: python3 -m unittest discover -s tests -p 'test_symphony_source.py' -v
      - run: python3 -m unittest discover -s tests -p 'test_symphony_reconcile.py' -v

  component:
    needs: contracts
    if: ${{ vars.COMPONENT_SOURCE_UPDATES == '1' && github.repository == 'troninster/nix-packages-public' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.contracts.outputs.components) }}
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/component-source-worker.yml
    with:
      component: ${{ matrix.component }}
