name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      packages:
        description: "Comma- or space-separated package names to build"
        required: false
        type: string
      all:
        description: "Build every package"
        required: false
        default: false
        type: boolean
      check_reproducibility:
        description: "Rebuild selected packages and require byte-identical outputs"
        required: false
        default: false
        type: boolean
      source_revision:
        description: "Restore selected packages from an exact public main-history SHA (without changing source pins)"
        required: false
        type: string

concurrency:
  group: ci-${{ inputs.source_revision && format('repair-{0}-{1}', inputs.source_revision, inputs.packages) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CACHIX_CACHE_NAME: ${{ vars.CACHIX_CACHE_NAME }}
  # Dependabot verifies builds without publishing or receiving the cache token.
  CACHIX_AUTH_TOKEN: ${{ github.event.pull_request.user.login != 'dependabot[bot]' && secrets.CACHIX_AUTH_TOKEN || '' }}
  REQUIRE_CACHIX_PUSH: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && '0' || '1' }}

jobs:
  detect-changes:
    name: Detect changed packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      packages_json: ${{ steps.detect.outputs.packages_json }}
      package_count: ${{ steps.detect.outputs.package_count }}
      run_checks: ${{ steps.detect.outputs.run_checks }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed packages
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MANUAL_PACKAGES: ${{ inputs.packages }}
          MANUAL_ALL: ${{ inputs.all }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$MANUAL_ALL" == "true" ]]; then
              ./scripts/detect-ci-packages --all
            elif [[ -n "$MANUAL_PACKAGES" ]]; then
              ./scripts/detect-ci-packages --packages "$MANUAL_PACKAGES"
            else
              ./scripts/detect-ci-packages "$(git rev-parse HEAD^)" "$(git rev-parse HEAD)"
            fi
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            ./scripts/detect-ci-packages "$PR_BASE_SHA" "$PR_HEAD_SHA"
          else
            ./scripts/detect-ci-packages --all
          fi

      - name: Check update workflow contracts
        run: python3 -m unittest discover -s tests -p test_update_upstreams.py -k UpdateUpstreamsWorkflowTests -k PackageDetectorTests -k UpdateArtifactTests -k GitHubCliToolchainTests -v

      - name: Validate historical cache repair request
        if: ${{ inputs.source_revision != '' }}
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
          PACKAGES: ${{ inputs.packages }}
          ALL: ${{ inputs.all }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test -n "$PACKAGES"
          test "$ALL" != true
          git fetch origin main "$SOURCE_REVISION"
          git merge-base --is-ancestor "$SOURCE_REVISION" origin/main

      - name: Prepare artifact transport smoke
        run: |
          mkdir -p "$RUNNER_TEMP/artifact-smoke-source"
          printf 'artifact transport fixture\n' > "$RUNNER_TEMP/artifact-smoke-source/probe.txt"

      - name: Upload artifact transport smoke
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifact-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifact-smoke-source
          if-no-files-found: error
          retention-days: 1

      - name: Download artifact transport smoke
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifact-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifact-smoke-received

      - name: Verify artifact transport smoke
        run: cmp "$RUNNER_TEMP/artifact-smoke-source/probe.txt" "$RUNNER_TEMP/artifact-smoke-received/probe.txt"

  flake-check:
    name: Flake check
    needs: detect-changes
    if: ${{ needs.detect-changes.result == 'success' && needs.detect-changes.outputs.run_checks == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Configure Cachix
        if: ${{ env.CACHIX_CACHE_NAME != '' && env.CACHIX_AUTH_TOKEN != '' }}
        uses: cachix/cachix-action@v17
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: Flake check
        continue-on-error: true
        run: nix flake check --no-build --print-build-logs --cores 1 --max-jobs 1

  build:
    name: Build ${{ matrix.package }}
    # We intentionally do NOT depend on `flake-check`. A flake-check failure
    # (e.g. a temporary breakage in a single package's derivation) should not
    # block the build matrix for unrelated packages. The build matrix runs as
    # long as `detect-changes` succeeded and at least one package was selected.
    # `flake-check` continues to run in parallel as an informational job;
    # `ci-result` ignores its result for the green/red CI signal.
    needs:
      - detect-changes
    if: ${{ needs.detect-changes.result == 'success' && needs.detect-changes.outputs.package_count != '0' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.detect-changes.outputs.packages_json) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          set -euo pipefail
          echo "Before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo docker image prune -af || true
          sudo docker builder prune -af || true
          sudo apt-get clean
          echo "After cleanup:"
          df -h /

      - name: Maximize Nix build disk space
        uses: easimon/maximize-build-space@v10
        with:
          build-mount-path: /nix
          build-mount-path-ownership: root:root
          root-reserve-mb: 8192
          temp-reserve-mb: 1024
          swap-size-mb: 8192
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true

      - name: Keep package build temporary files on the Nix volume
        run: |
          set -euo pipefail
          sudo install -d -m 1777 /nix/ci-tmp
          sudo install -d -m 0755 /nix/ci-build
          sudo install -d -m 0755 /etc/systemd/system/nix-daemon.service.d
          printf '[Service]\nEnvironment=TMPDIR=/nix/ci-tmp\n' \
            | sudo tee /etc/systemd/system/nix-daemon.service.d/ci-tmp.conf > /dev/null
          echo 'TMPDIR=/nix/ci-tmp' >> "$GITHUB_ENV"

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        env:
          TMPDIR: ${{ runner.temp }}
        with:
          extra_nix_config: |
            build-dir = /nix/ci-build
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Configure Cachix
        if: ${{ env.CACHIX_CACHE_NAME != '' && env.CACHIX_AUTH_TOKEN != '' }}
        uses: cachix/cachix-action@v17
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: Check Codex packaging contracts
        if: ${{ matrix.package == 'codex' }}
        run: python3 -m unittest discover -s tests -p test_update_upstreams.py -k CodexPackageContractTests -k CodexCargoHashUpdaterTests -v

      - name: Check Hermes packaging contracts
        if: ${{ matrix.package == 'hermes-agent' }}
        run: python3 -m unittest discover -s tests -p test_hermes_registration_lifecycle.py -v

      - name: Check Camofox packaging contracts
        if: ${{ matrix.package == 'camofox-browser' }}
        run: python3 -m unittest discover -s tests -p test_update_upstreams.py -k ExternalPackageContractTests.test_camofox -v

      - name: Check DeepSeek dependency policy cache
        if: ${{ matrix.package == 'deepseek-harness' }}
        run: node --test pkgs/deepseek-harness/normalize-policy-cache.test.mjs

      - name: Build package
        if: ${{ inputs.source_revision == '' }}
        run: NIX_BUILD_MONITOR=1 ./scripts/build-package "${{ matrix.package }}"

      - name: Repair the exact historical package cache
        if: ${{ inputs.source_revision != '' }}
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          # Keep current delivery/retention code, but evaluate original source
          # bytes: no flake update, cherry-pick, source commit or push.
          cp scripts/build-package "$RUNNER_TEMP/repair-build-package"
          git fetch origin main "$SOURCE_REVISION"
          git merge-base --is-ancestor "$SOURCE_REVISION" origin/main
          git switch --detach "$SOURCE_REVISION"
          NIX_BUILD_MONITOR=1 "$RUNNER_TEMP/repair-build-package" "$PACKAGE"

      - name: Check package reproducibility
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.check_reproducibility }}
        run: nix build --rebuild --no-link --print-build-logs --cores 1 --max-jobs 1 ".#${{ matrix.package }}"

  ci-result:
    name: CI result
    # `flake-check` runs in parallel for informational purposes only; we do
    # not gate the green/red CI signal on its result. A flake-check failure is
    # reported in the workflow run but does not turn the overall CI red.
    needs:
      - detect-changes
      - flake-check
      - build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check job results
        env:
          DETECT_RESULT: ${{ needs.detect-changes.result }}
          FLAKE_CHECK_RESULT: ${{ needs.flake-check.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          PACKAGE_COUNT: ${{ needs.detect-changes.outputs.package_count }}
        run: |
          set -euo pipefail

          # `flake-check` is informational; never fail the CI on it.
          # We only log its outcome for visibility and continue.
          if [[ -n "${FLAKE_CHECK_RESULT:-}" && "$FLAKE_CHECK_RESULT" != "success" && "$FLAKE_CHECK_RESULT" != "skipped" ]]; then
            echo "::warning::flake-check finished with result: $FLAKE_CHECK_RESULT (informational only, does not gate CI)"
          fi

          for result in "$DETECT_RESULT" "$BUILD_RESULT"; do
            case "$result" in
              success | skipped)
                ;;
              *)
                echo "A required CI job finished with result: $result" >&2
                exit 1
                ;;
            esac
          done

          echo "Package build count: ${PACKAGE_COUNT:-0}"
