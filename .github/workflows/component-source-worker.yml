name: Prepare and publish one enrolled component source
on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: source-${{ inputs.component }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout trusted source adapter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
      - name: Checkout approved main source data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: candidate
          persist-credentials: false
      - name: Install Nix for read-only candidate preparation
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          install_url: https://releases.nixos.org/nix/nix-2.28.5/install
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Prepare literal pins and prove any changed candidate before source publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 trusted/tools/component-source.py "${{ inputs.component }}" "$PWD/candidate" "$RUNNER_TEMP/preparation.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.component }}-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/preparation.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout trusted keyless source publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.component }}-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-proof
      - name: Reapply only proved pins on fresh main and wake the existing factory
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 trusted/tools/component-reconcile.py "${{ inputs.component }}" "$PWD/trusted" "$RUNNER_TEMP/source-proof/preparation.json" "$RUNNER_TEMP/source-publication"
