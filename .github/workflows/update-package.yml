name: Update isolated package

on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
    secrets:
      CACHIX_AUTH_TOKEN:
        required: false

jobs:
  prepare:
    name: Build verified ${{ inputs.package }} update
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}
      changed: ${{ steps.update.outputs.changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Record base revision
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        run: |
          set -euo pipefail
          echo "Before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo docker image prune -af || true
          sudo docker builder prune -af || true
          sudo apt-get clean
          echo "After cleanup:"
          df -h /

      - name: Maximize Nix build disk space
        uses: easimon/maximize-build-space@fc881a613ad2a34aca9c9624518214ebc21dfc0c # v10
        with:
          build-mount-path: /nix
          build-mount-path-ownership: root:root
          root-reserve-mb: 8192
          temp-reserve-mb: 1024
          swap-size-mb: 8192
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Update selected upstream input
        id: update
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/update-upstream-inputs --package "${{ inputs.package }}"

      # `Flake check` remains informational. Changed packages must still build;
      # a later write job receives only the resulting narrow patch artifact.
      - name: Flake check (informational)
        if: ${{ steps.update.outputs.changed == 'true' }}
        continue-on-error: true
        run: nix flake check --no-build --print-build-logs --cores 1 --max-jobs 1

      - name: Detect Cachix configuration
        id: cachix
        if: ${{ steps.update.outputs.changed == 'true' }}
        env:
          CACHIX_CACHE_NAME: ${{ vars.CACHIX_CACHE_NAME }}
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [[ -n "$CACHIX_CACHE_NAME" && -n "$CACHIX_AUTH_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Cachix
        if: ${{ steps.update.outputs.changed == 'true' && steps.cachix.outputs.enabled == 'true' }}
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        env:
          CACHIX_CACHE_NAME: ${{ vars.CACHIX_CACHE_NAME }}
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          authToken: ${{ env.CACHIX_AUTH_TOKEN }}

      - name: Check Hermes packaging contracts
        if: ${{ inputs.package == 'hermes-agent' && steps.update.outputs.changed == 'true' }}
        run: python3 -m unittest discover -s tests -p test_hermes_registration_lifecycle.py -v

      - name: Build selected package
        if: ${{ steps.update.outputs.changed == 'true' }}
        env:
          CACHIX_CACHE_NAME: ${{ vars.CACHIX_CACHE_NAME }}
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          REQUIRE_CACHIX_PUSH: 1
        run: NIX_BUILD_MONITOR=1 ./scripts/build-package "${{ inputs.package }}"

      - name: Create selected publication artifact
        if: ${{ steps.update.outputs.changed == 'true' }}
        run: |
          ./scripts/update-artifact create \
            --phase "${{ inputs.package }}" \
            --base-sha "${{ steps.base.outputs.sha }}" \
            --packages-file .changed-packages \
            --artifact-dir "$RUNNER_TEMP/package-update-${{ inputs.package }}"

      - name: Upload selected publication artifact
        if: ${{ steps.update.outputs.changed == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-update-${{ inputs.package }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/package-update-${{ inputs.package }}
          if-no-files-found: error
          retention-days: 1

      - name: No selected upstream update
        if: ${{ steps.update.outputs.changed != 'true' }}
        run: echo "Selected upstream package pin is already current."

  publish:
    name: Publish verified ${{ inputs.package }} update
    needs: prepare
    if: ${{ always() && !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout exact base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 1

      - name: Download selected publication artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-update-${{ inputs.package }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/package-update-${{ inputs.package }}

      - name: Revalidate and apply selected artifact
        env:
          EXPECTED_BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Prepare job returned an invalid base SHA."
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$EXPECTED_BASE_SHA" ]]; then
            echo "::error::Publisher checkout does not match the prepared base."
            exit 1
          fi
          remote_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$remote_sha" != "$EXPECTED_BASE_SHA" ]]; then
            echo "::error::main moved after selected update was prepared; refusing stale publication."
            exit 1
          fi
          ./scripts/update-artifact verify-apply \
            --phase "${{ inputs.package }}" \
            --base-sha "$EXPECTED_BASE_SHA" \
            --artifact-dir "$RUNNER_TEMP/package-update-${{ inputs.package }}"

      - name: Commit and push selected update
        env:
          EXPECTED_BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "deps: update ${{ inputs.package }} pin [skip ci]"
          remote_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$remote_sha" != "$EXPECTED_BASE_SHA" ]]; then
            echo "::error::main moved before upstream publication; refusing non-current push."
            exit 1
          fi
          git push origin HEAD:refs/heads/main
