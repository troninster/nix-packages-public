name: Enrolled component build proof

on:
  pull_request:
    paths:
      - 'components/**'
      - 'tools/component-*.py'
      - 'scripts/build-component'
      - 'tests/test_component*.py'
      - 'scripts/build-symphony-component'
      - 'tests/test_symphony_component.py'
      - '.github/workflows/symphony-component.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry:
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.registry.outputs.components }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: registry
        run: echo "components=$(python3 tools/component-contract.py list)" >> "$GITHUB_OUTPUT"
  build:
    needs: registry
    strategy:
      matrix:
        component: ${{ fromJSON(needs.registry.outputs.components) }}
    name: Verify independent component
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check Symphony component contracts
        run: python3 -m unittest discover -s tests -p test_symphony_component.py -v

      - name: Check, rebuild and smoke the component
        run: bash ./scripts/build-component "${{ matrix.component }}"
